<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Henna Nirali - Henna Art Gallery">
  <title>Henna by Nirali & Kaushika | Art Gallery</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="page-bg"></div>

  <header class="hero">
    <div class="brand-mark">KN</div>
    <p class="eyebrow">HENNA ART GALLERY</p>
    <h1>Henna By Nirali & Kaushika</h1>
    <p class="intro">A collection of handcrafted henna designs for weddings, celebrations & special occasions.</p>
    <a class="instagram" href="https://www.instagram.com/henna.nirali/" target="_blank" rel="noopener">
      @henna.nirali
    </a>
    <a class="instagram" href="https://www.instagram.com/kaya_henna/" target="_blank" rel="noopener">
      @kaya_henna
    </a>
  </header>

  <main>
    <section class="gallery" id="gallery" aria-label="Henna art gallery"></section>
  </main>

  <div class="lightbox" id="lightbox" aria-hidden="true">
    <button class="close" id="closeBtn" aria-label="Close image">&times;</button>
    <button class="nav prev" id="prevBtn" aria-label="Previous image">&#10094;</button>
    <img id="lightboxImage" src="" alt="Henna artwork">
    <button class="nav next" id="nextBtn" aria-label="Next image">&#10095;</button>
  </div>

  <footer>
    <p>© <span id="year"></span> Henna Nirali and Kaushika</p>
    <a href="https://www.instagram.com/henna.nirali/" target="_blank" rel="noopener">Follow Nirali on Instagram</a>
    <a href="https://www.instagram.com/kaya_henna/" target="_blank" rel="noopener">Follow Kaushika on Instagram</a>
  </footer>

  <script src="gallery.js"></script>
</body>
</html>
